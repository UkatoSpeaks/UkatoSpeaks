name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: soulteary/github-readme-stats-action@v1.0.0
        continue-on-error: true
        with:
          card: stats
          options: 'username=UkatoSpeaks&show_icons=true&theme=dark&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: soulteary/github-readme-stats-action@v1.0.0
        continue-on-error: true
        with:
          card: top-langs
          options: 'username=UkatoSpeaks&layout=compact&theme=dark&hide_border=true&langs_count=8'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        continue-on-error: true
        with:
          options: 'username=UkatoSpeaks&theme=darkhub&no-frame=true&margin-w=10&row=1&column=7'
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"
          git push
